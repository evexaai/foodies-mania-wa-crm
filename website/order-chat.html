<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Foodies Mania | Order by Chat</title>
<meta name="description" content="Tell Foodies Mania what you're craving, in English or Roman Urdu. We build your order as you chat and send it straight to the kitchen.">
<meta name="theme-color" content="#130b07">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/order-chat.css">
</head>
<body class="oc">

<!-- the stage: ember glow, rising sparks, a giant watermark -->
<div class="stage" aria-hidden="true">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <canvas id="embers"></canvas>
  <div class="mark">FOODIES<br>MANIA</div>
</div>

<header class="oc-top">
  <a href="index.html" class="oc-brand" aria-label="Back to Foodies Mania"><img src="assets/logo.webp" alt="" width="40" height="40"><span><b>Foodies Mania</b><small>Order by chat</small></span></a>
  <div class="oc-status"><span class="live-dot" id="openDot"></span><span id="openTxt">Kitchen open · till 5 AM</span></div>
  <nav class="oc-nav">
    <a href="index.html#menu" class="oc-link">Full menu</a>
    <button class="oc-link" id="newChat" title="Start a new conversation">New chat</button>
    <a href="index.html" class="oc-icon" aria-label="Website home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  </nav>
</header>

<main class="oc-main">
  <!-- the conversation -->
  <section class="convo" aria-label="Conversation with Foodies Mania">
    <div class="chat-log" id="log" aria-live="polite"></div>
    <div class="dock">
      <div class="chat-quick" id="quick"></div>
      <form class="composer" id="form">
        <button type="button" class="cmp-btn" id="menuBtn" aria-label="Show the menu" title="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
        <input id="in" placeholder="Tell me what you’re craving…" autocomplete="off" aria-label="Message" enterkeyhint="send">
        <button class="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <p class="dock-note">English or Roman Urdu · <span class="pow">Powered by <a href="https://evexaai.com" target="_blank" rel="noopener"><img src="assets/evexa.webp" alt="Evexa AI" width="62" height="14"></a></span></p>
    </div>
  </section>

  <!-- the kitchen ticket: the order, printing live -->
  <aside class="ticket-wrap" id="tw" aria-label="Your kitchen ticket">
    <div class="ticket" id="ticket">
      <div class="tk-edge top"></div>
      <div class="tk-in" id="tk"></div>
      <div class="tk-edge bot"></div>
    </div>
  </aside>
</main>

<script src="js/menu.js"></script>
<script src="js/bridge.js"></script>
<script src="js/cart.js"></script>
<script src="js/agent.js"></script>
<script src="js/chatui.js"></script>
<script src="js/order-chat.js"></script>
</body>
</html>
